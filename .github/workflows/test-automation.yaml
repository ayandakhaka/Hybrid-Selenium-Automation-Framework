
name: Automation Exercise CI Pipeline

on:
  schedule:
    - cron: '0 20 * * *'
      timezone: 'Africa/Johannesburg'

  workflow_dispatch:

  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:

  # ==========================================================
  # UI + API TESTS AND ALLURE REPORT
  # ==========================================================
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # ========================================================
      # Checkout repository
      # ========================================================
      - name: Checkout Code
        uses: actions/checkout@v4

      # ========================================================
      # Setup GitHub Pages
      # ========================================================
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      # ========================================================
      # Setup Java 21
      # ========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # ========================================================
      # Verify Java and Maven
      # ========================================================
      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      # ========================================================
      # Restore previous Allure history
      # ========================================================
      - name: Restore Allure History
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}
          restore-keys: |
            allure-history-

      - name: Inspect Restored Allure History
        if: always()
        run: |
          if [ -d "allure-history" ] && [ "$(ls -A allure-history)" ]; then
            echo "Previous Allure history restored."
            find allure-history -maxdepth 2 -type f
          else
            echo "No previous Allure history found."
          fi

      # ========================================================
      # Run API and UI TestNG suites
      #
      # IMPORTANT:
      # Run clean only before the first suite.
      # The second Maven command must preserve API Allure results.
      # ========================================================
      - name: Run UI and API Tests
        id: run-tests
        shell: bash
        run: |
          echo "========================================"
          echo "Running API TestNG Suite"
          echo "========================================"

          if mvn clean test \
            -DsuiteXmlFile=src/test/resources/testng-api.xml; then
            API_STATUS=0
          else
            API_STATUS=$?
          fi

          echo "========================================"
          echo "Running UI TestNG Suite"
          echo "========================================"

          if mvn test \
            -DsuiteXmlFile=src/test/resources/testng-ui.xml; then
            UI_STATUS=0
          else
            UI_STATUS=$?
          fi

          echo "========================================"
          echo "Test Execution Summary"
          echo "========================================"
          echo "API exit code: $API_STATUS"
          echo "UI exit code: $UI_STATUS"

          echo "api_status=$API_STATUS" >> "$GITHUB_OUTPUT"
          echo "ui_status=$UI_STATUS" >> "$GITHUB_OUTPUT"

          # Test failures are evaluated after report generation
          # and artifact uploads.

      # ========================================================
      # Prepare Allure results
      # ========================================================
      - name: Prepare Allure Results
        if: always()
        run: |
          mkdir -p target/allure-results

          echo "Allure result files:"
          find target/allure-results -maxdepth 2 -type f || true

      # ========================================================
      # Restore previous Allure trend history
      # ========================================================
      - name: Prepare Previous Allure History
        if: always()
        run: |
          if [ -d "allure-history" ] && [ "$(ls -A allure-history)" ]; then
            mkdir -p target/allure-results/history

            cp -R allure-history/. target/allure-results/history/

            echo "Previous Allure history copied."
          else
            echo "No previous history available."
          fi

      # ========================================================
      # Add Allure environment metadata
      # ========================================================
      - name: Add Allure Environment
        if: always()
        run: |
          mkdir -p target/allure-results

          EXECUTION_DATE=$(date '+%d %B %Y')
          EXECUTION_TIME=$(date '+%H:%M:%S %Z')

          cat > target/allure-results/environment.properties <<EOF
          Environment=QA
          Project=Hybrid UI & API Test Automation
          Test Suite=UI and API Automation
          Execution Mode=CI/CD
          Automation Framework=Selenium + Rest Assured
          Test Framework=TestNG
          Programming Language=Java 21
          Build Tool=Maven
          CI/CD=GitHub Actions
          Operating System=Ubuntu Linux
          Browser Automation=Selenium WebDriver
          API Automation=Rest Assured
          Reporting=Allure
          Execution Date=${EXECUTION_DATE}
          Execution Time=${EXECUTION_TIME}
          Build Number=${{ github.run_number }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          Trigger=${{ github.event_name }}
          EOF

          cat target/allure-results/environment.properties

      # ========================================================
      # Generate Allure report
      # ========================================================
      - name: Generate Allure Report
        if: always()
        run: |
          echo "Generating combined UI and API Allure report..."

          mvn allure:report

      # ========================================================
      # Customize Allure report branding
      # ========================================================
      - name: Customize Allure Report Branding
        if: always()
        run: |
          REPORT_DIR="target/site/allure-maven-plugin"

          if [ ! -d "$REPORT_DIR" ]; then
            echo "ERROR: Allure report directory not found."
            exit 1
          fi

          grep -RIl \
            --exclude="*.map" \
            "Allure Report" \
            "$REPORT_DIR" \
            > /tmp/allure-title-files.txt || true

          while IFS= read -r FILE; do
            if [ -f "$FILE" ]; then
              sed -i \
                's/Allure Report/Hybrid UI \& API Test Automation — QA Report/g' \
                "$FILE"
            fi
          done < /tmp/allure-title-files.txt

          if [ -f "$REPORT_DIR/index.html" ]; then
            sed -i \
              's/<title>[^<]*<\/title>/<title>Hybrid UI \& API Test Automation — QA Report<\/title>/g' \
              "$REPORT_DIR/index.html"
          fi

          echo "Report branding customization completed."

      # ========================================================
      # Verify generated report
      # ========================================================
      - name: Verify Allure Report
        if: always()
        run: |
          REPORT="target/site/allure-maven-plugin/index.html"

          if [ -f "$REPORT" ]; then
            echo "Allure report generated successfully."
            grep -o '<title>[^<]*</title>' "$REPORT" || true
          else
            echo "ERROR: Allure report was not generated."
            find target -maxdepth 4 -type f | head -200 || true
            exit 1
          fi

      # ========================================================
      # Verify Allure trend history
      # ========================================================
      - name: Verify Allure History
        if: always()
        run: |
          HISTORY_DIR="target/site/allure-maven-plugin/history"
          TREND_FILE="$HISTORY_DIR/history-trend.json"

          if [ -d "$HISTORY_DIR" ]; then
            echo "Allure history files:"
            find "$HISTORY_DIR" -maxdepth 2 -type f

            if [ -f "$TREND_FILE" ]; then
              python3 -c '
          import json
          from pathlib import Path

          path = Path("target/site/allure-maven-plugin/history/history-trend.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          print(f"Recorded trend executions: {len(data)}")

          for i, item in enumerate(data, start=1):
              stats = item.get("data", {})
              print(
                  f"Execution {i}: "
                  f"total={stats.get('total', 0)}, "
                  f"passed={stats.get('passed', 0)}, "
                  f"failed={stats.get('failed', 0)}, "
                  f"broken={stats.get('broken', 0)}, "
                  f"skipped={stats.get('skipped', 0)}"
              )
          '
            else
              echo "No history-trend.json found."
            fi
          else
            echo "No generated history directory found."
          fi

      # ========================================================
      # Prepare updated Allure history
      # ========================================================
      - name: Prepare Updated Allure History
        if: always()
        run: |
          rm -rf allure-history
          mkdir -p allure-history

          HISTORY_DIR="target/site/allure-maven-plugin/history"

          if [ -d "$HISTORY_DIR" ]; then
            cp -R "$HISTORY_DIR"/. allure-history/
            echo "Updated Allure history prepared."
            find allure-history -type f
          else
            echo "No report history available to cache."
          fi

      # ========================================================
      # Save updated history
      # ========================================================
      - name: Save Allure History
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}

      # ========================================================
      # Upload GitHub Pages artifact
      # ========================================================
      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin/

      # ========================================================
      # Upload TestNG / Surefire reports
      # ========================================================
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: target/surefire-reports/
          if-no-files-found: warn
          retention-days: 30

      # ========================================================
      # Upload raw Allure results
      # ========================================================
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}
          path: target/allure-results/
          if-no-files-found: warn
          retention-days: 30

      # ========================================================
      # Upload generated Allure HTML report
      # ========================================================
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_id }}
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn
          retention-days: 30

      # ========================================================
      # Final test status
      # Report and artifact steps run before this step.
      # ========================================================
      - name: Final Test Status
        if: always()
        shell: bash
        env:
          API_STATUS: ${{ steps.run-tests.outputs.api_status }}
          UI_STATUS: ${{ steps.run-tests.outputs.ui_status }}
        run: |
          echo "API test exit code: ${API_STATUS:-unknown}"
          echo "UI test exit code: ${UI_STATUS:-unknown}"

          if [[ "$API_STATUS" != "0" || "$UI_STATUS" != "0" ]]; then
            echo "One or more test suites failed."
            exit 1
          fi

          echo "Both UI and API test suites passed."

  # ==========================================================
  # DEPLOY ALLURE REPORT TO GITHUB PAGES
  # ==========================================================
  deploy:
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    needs: api-tests
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4

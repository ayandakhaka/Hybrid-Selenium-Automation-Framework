name: API Automation CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# GitHub permissions
# ============================================================
permissions:
  contents: read
  pages: write
  id-token: write


jobs:

  # ==========================================================
  # API TESTS + ALLURE REPORT
  # ==========================================================
  api-tests:

    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # Checkout repository
      # ========================================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ========================================================
      # Setup GitHub Pages
      # ========================================================
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5


      # ========================================================
      # Setup Java 21
      # ========================================================
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven


      # ========================================================
      # Verify Java and Maven
      # ========================================================
      - name: Verify Java and Maven
        run: |

          echo "========================================"
          echo "Java Version"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "Maven Version"
          echo "========================================"

          mvn -version


      # ========================================================
      # Restore previous Allure history
      # ========================================================
      - name: Restore Allure History
        uses: actions/cache/restore@v4
        with:
          path: allure-history
          key: allure-history-main
          restore-keys: |
            allure-history-


      # ========================================================
      # Run API Tests
      # ========================================================
      - name: Run API Tests
        run: |

          echo "========================================"
          echo "Running API Tests"
          echo "========================================"

          mvn clean test \
            -DsuiteXmlFile=src/test/resources/testng-api.xml


      # ========================================================
      # Prepare Allure Results
      # ========================================================
      - name: Prepare Allure Results
        if: always()
        run: |

          mkdir -p target/allure-results

          echo "========================================"
          echo "Allure Results"
          echo "========================================"

          if [ -d "target/allure-results" ]; then

            find target/allure-results \
              -maxdepth 1 \
              -type f \
              -print

          else

            echo "No Allure results directory found."

          fi


      # ========================================================
      # Restore previous Allure history
      # ========================================================
      - name: Prepare Previous Allure History
        if: always()
        run: |

          if [ -d "allure-history" ] && [ "$(ls -A allure-history)" ]; then

            echo "Previous Allure history found."

            mkdir -p target/allure-results/history

            cp -R \
              allure-history/. \
              target/allure-results/history/

            echo "Previous Allure history copied."

          else

            echo "No previous Allure history found."

          fi


      # ========================================================
      # Add Allure Environment
      # ========================================================
      - name: Add Allure Environment
        if: always()
        run: |

          mkdir -p target/allure-results

          EXECUTION_DATE=$(date '+%d %B %Y')

          cat > target/allure-results/environment.properties <<EOF
          Environment=QA
          Suite=API Automation
          Execution Date=${EXECUTION_DATE}
          Execution Mode=CI/CD
          Java Version=21
          Operating System=Linux
          Test Framework=TestNG
          Build Number=${{ github.run_number }}
          Branch=${{ github.ref_name }}
          Commit=${{ github.sha }}
          EOF

          echo "========================================"
          echo "Allure Environment"
          echo "========================================"

          cat target/allure-results/environment.properties


      # ========================================================
      # Generate Allure Report
      # ========================================================
      - name: Generate Allure Report
        if: always()
        run: |

          echo "========================================"
          echo "Generating Allure Report"
          echo "========================================"

          mvn allure:report
          
      - name: Diagnose Allure Title
        if: always()
        run: |

          echo "========================================"
          echo "Searching Allure Report for title"
          echo "========================================"

          grep -RIn \
            --exclude="*.map" \
            "Allure Report" \
            target/site/allure-maven-plugin/ \
            | head -100 || true


      # ========================================================
      # CUSTOMIZE ALLURE REPORT BRANDING
      # ========================================================
      - name: Customize Allure Report Branding
        if: always()
        run: |

          REPORT_DIR="target/site/allure-maven-plugin"

          echo "========================================"
          echo "Customizing Allure Report Branding"
          echo "========================================"

          if [ ! -d "$REPORT_DIR" ]; then
            echo "ERROR: Allure report directory not found."
            exit 1
          fi

          echo ""
          echo "Searching generated Allure files..."

          # ----------------------------------------------------
          # Find JavaScript files containing the default title
          # ----------------------------------------------------
          grep -RIl \
            --exclude="*.map" \
            "Allure Report" \
            "$REPORT_DIR" \
            > /tmp/allure-title-files.txt || true


          echo ""
          echo "Files containing 'Allure Report':"

          cat /tmp/allure-title-files.txt || true


          # ----------------------------------------------------
          # Replace the default Allure title in generated files
          # ----------------------------------------------------
          while IFS= read -r FILE
          do

            if [ -f "$FILE" ]; then

              echo ""
              echo "Updating:"
              echo "$FILE"

              sed -i \
                's/Allure Report/Hybrid UI \& API Test Automation — QA Report/g' \
                "$FILE"

            fi

          done < /tmp/allure-title-files.txt


          # ----------------------------------------------------
          # Also update HTML title if present
          # ----------------------------------------------------
          if [ -f "$REPORT_DIR/index.html" ]; then

            sed -i \
              's/<title>[^<]*<\/title>/<title>Hybrid UI \& API Test Automation — QA Report<\/title>/g' \
              "$REPORT_DIR/index.html"

          fi


          echo ""
          echo "========================================"
          echo "Branding verification"
          echo "========================================"

          grep -RIl \
            --exclude="*.map" \
            "Hybrid UI & API Test Automation" \
            "$REPORT_DIR" \
            | head -50 || true


      # ========================================================
      # Verify Allure Report
      # ========================================================
      - name: Verify Allure Report
        if: always()
        run: |

          echo "========================================"
          echo "Allure Report Verification"
          echo "========================================"

          REPORT="target/site/allure-maven-plugin/index.html"

          if [ -f "$REPORT" ]; then

            echo "Allure report generated successfully."

            echo ""
            echo "Report location:"
            echo "$REPORT"

            echo ""
            echo "Report title:"
            grep -o \
              '<title>[^<]*</title>' \
              "$REPORT"

          else

            echo "ERROR: Allure report was not generated."

            echo ""
            echo "Contents of target:"

            find target \
              -maxdepth 4 \
              -type f | head -200

            exit 1

          fi


      # ========================================================
      # Verify Allure History
      # ========================================================
      - name: Verify Allure History
        if: always()
        run: |

          echo "========================================"
          echo "Allure History Verification"
          echo "========================================"

          if [ -d "target/site/allure-maven-plugin/history" ]; then

            echo "Allure history exists."

            echo ""

            find target/site/allure-maven-plugin/history \
              -type f \
              -maxdepth 2

          else

            echo "WARNING: No Allure history directory found."

          fi


      # ========================================================
      # Prepare Updated Allure History
      # ========================================================
      - name: Prepare Updated Allure History
        if: always()
        run: |

          rm -rf allure-history

          mkdir -p allure-history

          if [ -d "target/site/allure-maven-plugin/history" ]; then

            cp -R \
              target/site/allure-maven-plugin/history/. \
              allure-history/

            echo "Updated Allure history prepared."

            echo ""
            echo "History files:"

            find allure-history \
              -type f

          else

            echo "No Allure history to save."

          fi


      # ========================================================
      # Save Updated Allure History
      # ========================================================
      - name: Save Allure History
        if: always()
        uses: actions/cache/save@v4
        with:
          path: allure-history
          key: allure-history-${{ github.run_id }}


      # ========================================================
      # Upload GitHub Pages Artifact
      # ========================================================
      - name: Upload GitHub Pages Artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/site/allure-maven-plugin/


      # ========================================================
      # Upload Surefire Reports
      # ========================================================
      - name: Upload Surefire Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: warn


      # ========================================================
      # Upload Raw Allure Results
      # ========================================================
      - name: Upload Allure Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results/
          if-no-files-found: warn


      # ========================================================
      # Upload Generated Allure HTML Report
      # ========================================================
      - name: Upload Allure HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin/
          if-no-files-found: warn


  # ==========================================================
  # DEPLOY TO GITHUB PAGES
  # ==========================================================
  deploy:

    if: github.ref == 'refs/heads/main'

    needs: api-tests

    runs-on: ubuntu-latest

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    permissions:

      pages: write
      id-token: write

    steps:

      # ========================================================
      # Deploy Allure Report
      # ========================================================
      - name: Deploy Allure Report
        id: deployment
        uses: actions/deploy-pages@v4